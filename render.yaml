services:
  - type: web
    name: astutecorp-crm
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --timeout 120 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        value: sqlite:////var/data/corp_crm.db
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1